name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend (.NET 10 + PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simulador
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar solução backend
        run: dotnet restore src/backend/Simulador.slnx

      - name: Compilar solução backend
        run: dotnet build src/backend/Simulador.slnx --no-restore

      - name: Executar testes unitários e de API (xUnit)
        run: dotnet test src/backend/Simulador.slnx --no-build --verbosity normal

      - name: Executar testes de integração PostgreSQL
        env:
          SIMULADOR_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=simulador;Username=postgres;Password=postgres
        run: dotnet test src/backend/tests/Simulador.Infra.IntegrationTests/Simulador.Infra.IntegrationTests.csproj --verbosity normal

  frontend:
    name: Frontend (React 19 + Vitest + Oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Instalar dependências
        run: npm ci

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Testes unitários e de acessibilidade (Vitest + axe-core)
        run: npm test -- --run

      - name: Build de produção e checagem anti-segredos no bundle
        run: npm run build
  e2e:
    name: E2E (Playwright, backend em segundo plano + vite preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/frontend
    env:
      # O Playwright reaproveita os servidores abaixo em vez de subir os seus.
      E2E_SERVIDORES_EXTERNOS: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'
      - name: Instalar dependências do frontend
        run: npm ci
      - name: Compilar a API
        run: dotnet build ../backend/src/Simulador.Api
      - name: Build do frontend
        run: npm run build
      - name: Subir a API em segundo plano (provedor em memória)
        env:
          # Todos os testes usam um único IP; o limite padrão de 120 requisições por minuto geraria HTTP 429.
          RateLimit__PermitLimit: '5000'
        run: |
          nohup dotnet run --no-build --project ../backend/src/Simulador.Api --urls http://localhost:8080 > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/api.pid"
      - name: Subir o vite preview em segundo plano
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/preview.pid"
      - name: Aguardar API e frontend
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/health/live
          echo
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused --output /dev/null http://127.0.0.1:5173/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:5173/health/live
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E (chromium, mobile-375 e desktop-1440)
        run: npx playwright test --project=chromium --project=mobile-375 --project=desktop-1440 --reporter=list,html
      - name: Mostrar logs dos servidores em caso de falha
        if: failure()
        run: |
          echo '--- api.log ---'; tail -n 100 "$RUNNER_TEMP/api.log" || true
          echo '--- preview.log ---'; tail -n 100 "$RUNNER_TEMP/preview.log" || true
      - name: Publicar relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
