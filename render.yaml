services:
  - type: web
    name: it-career-simulator-api
    runtime: docker
    plan: free
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: ./src/backend
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: EventStore__Provedor
        value: Postgres
      - key: Sessao__TtlDias
        value: "30"
      - key: Dialogo__HabilitarLlm
        value: "false"
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
