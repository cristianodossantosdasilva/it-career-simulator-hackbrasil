services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simulador_hackbrasil}
      POSTGRES_USER: ${POSTGRES_USER:-simulador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simulador_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simulador} -d ${POSTGRES_DB:-simulador_hackbrasil}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      EventStore__Provedor: Postgres
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-simulador_hackbrasil};Username=${POSTGRES_USER:-simulador};Password=${POSTGRES_PASSWORD:-simulador_dev_only}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
